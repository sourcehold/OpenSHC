# Taken mostly from https://cpp-linter.github.io/cpp-linter-action/examples/

name: cpp-linter

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

  # Required checks have to report on the merge queue's own commit as well, or
  # the queue waits for a cpp-linter that never runs and times the group out.
  merge_group:

  push:
    branches: [main]

jobs:
  cpp-linter:
    # only run on non-draft PRs, this will skip the job for drafts and report success, but drafts can not be merged anyway
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          # A merge group commit needs its base present to be diffed against,
          # and a batched group's parent is the previous group rather than main.
          # The pack is ~54 MiB, so taking the history is cheaper than guessing
          # a depth.
          fetch-depth: ${{ github.event_name == 'merge_group' && 0 || 1 }}
          persist-credentials: false

      # Detect if any relevant files changed
      - name: Detect relevant files
        id: filter
        uses: dorny/paths-filter@v4
        # Same reasoning as the linter step: in the queue, a filter that cannot
        # work out a base leaves 'cpp' empty, which skips the lint rather than
        # failing the group.
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        with:
          # pull_request and push carry their own base; merge_group does not.
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            cpp:
              - '**/*.c'
              - '**/*.cpp'
              - '**/*.h'
              - '**/*.hpp'
              - '**/*.cxx'
              - '**/*.hxx'
              - '**/*.cc'
              - '**/*.hh'
              - '**/CMakeLists.txt'
              - 'meson.build'
              - '**/*.cmake'

      # ... optionally setup build env to create a compilation database

      - name: Run cpp-linter
        id: linter
        uses: cpp-linter/cpp-linter-action@v2
        if: steps.filter.outputs.cpp == 'true'
        # cpp-linter documents pull_request and push, and says nothing about
        # merge_group, so in the queue the action itself breaking must not be
        # able to wedge a group: the pass/fail below is decided by its
        # checks-failed output, which is empty if it never got that far. The
        # same files were linted on the pull request, where this check is also
        # required and does fail the job, so nothing reaches main unlinted.
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 22

          style: 'file'  # Use .clang-format config file.
          tidy-checks: '-*' # Disable clang-tidy checks.

          # Generate the report as a file for the separate comment workflow.
          summary-output-file: ${{ runner.temp }}/cpp-linter-comment/comment.md

          # Do not post comments from this unprivileged workflow.
          file-annotations: false

      - name: Save the pull request number and check result
        if: github.event_name == 'pull_request' && steps.filter.outputs.cpp == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHECKS_FAILED: ${{ steps.linter.outputs.checks-failed }}
        run: |
          mkdir -p "$RUNNER_TEMP/cpp-linter-comment"
          echo "$PR_NUMBER" > "$RUNNER_TEMP/cpp-linter-comment/pr-number.txt"
          echo "${CHECKS_FAILED:-0}" > "$RUNNER_TEMP/cpp-linter-comment/checks-failed.txt"

      # Upload the report for the separate privileged workflow.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request' && steps.filter.outputs.cpp == 'true'
        with:
          name: cpp-linter-comment
          path: ${{ runner.temp }}/cpp-linter-comment/
          retention-days: 7

      # Fail the job only if the linter ran and found issues.
      - name: Fail fast if linter failed
        if: steps.filter.outputs.cpp == 'true' && steps.linter.outputs.checks-failed > 0
        run: exit 1

      # Optional: print a message if no relevant files changed.
      - name: Skip message
        if: steps.filter.outputs.cpp != 'true'
        run: echo "No relevant C/C++/CMake files changed — cpp-linter skipped"
